; SIP AI Platform — Dialplan Configuration (Development)
; Phase 2B: PJSIP + Linphone Telephony Foundation
;
; Minimal dialplan for testing Linphone registration and basic calls.
; NOT for production use.

[general]
; Global dialplan settings
static=yes
writprotect=no
clearglobalvars=no

[globals]
; Global variables can be defined here

; ============================================================================
; INTERNAL CONTEXT - Main dialplan context
; ============================================================================

[internal]
; Extension 1001 - Linphone client
; This allows Linphone (1001) to call other extensions
exten => 1001,1,Dial(PJSIP/1001)

; Extension 2000 - AI service placeholder
; When called, answers and provides echo test for audio verification
exten => 2000,1,NoOp(Incoming call to AI service placeholder)
  same => n,Answer()
  same => n,Playback(hello-world)  ; Play confirmation prompt
  same => n,Echo()                ; Echo test - caller hears their own voice
  same => n,Hangup()

; Extension 1002 - Direct echo test (alternative)
exten => 1002,1,Answer()
  same => n,Echo()
  same => n,Hangup()

; Invalid extension handler
; Catch-all for undefined extensions to prevent misrouting
exten => i,1,NoOp(Invalid extension dialed)
  same => n,Playback(pbx-invalid)
  same => n,Hangup()

; Include test context for temporary extensions
include => test

; ============================================================================
; TEST CONTEXT - Additional test extensions
; ============================================================================

[test]
; Test extensions for development
; These are NOT in the main internal context

; DTMF Test Extension - RFC4733 validation
exten => 3000,1,NoOp(DTMF Test - Starting)
  same => n,Answer()
  same => n,Wait(1)
  same => n,Playback(digits/1)  ; Play "1" to indicate test start
  same => n,Wait(1)
  ; Read DTMF digits - timeout 5s, max 1 digit per read, no audio prompt
  ; Change terminator from # to 't' to allow testing # key
  ; This allows testing each digit individually including #
  same => n,Read(DTMF_DIGIT,,1,t,5)
  same => n,NoOp(DTMF received: ${DTMF_DIGIT})
  same => n,Verbose(1,DTMF Test: Received digit ${DTMF_DIGIT})
  same => n,Wait(2)
  same => n,Hangup()

; ============================================================================
; INBOUND CONTEXT - For future external calls
; ============================================================================

[inbound]
; Currently unused - placeholder for future external call handling
; All calls should go through internal context for now

; ============================================================================
; OUTBOUND CONTEXT - For future outbound calls
; ============================================================================

[outbound]
; Currently unused - placeholder for future outbound call handling

; ============================================================================
; DEFAULT CONTEXT - Fallback
; ============================================================================

[default]
; Fallback context - should not be used in normal operation
; Just hang up any calls that end up here
;exten => _.,1,NoOp(Call reached default context - this should not happen)
  same => n,Hangup()

; ============================================================================
; INCLUDES - Context includes for modularity
; ============================================================================

; Uncomment to include other contexts if needed
;include => test
;include => inbound
;include => outbound
