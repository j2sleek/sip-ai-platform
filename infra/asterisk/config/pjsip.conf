; SIP AI Platform — PJSIP Configuration (Development)
; Phase 2B: PJSIP + Linphone Telephony Foundation

[global]
type=global
endpoint_identifier_order=auth_username,username,ip,anonymous
default_realm=asterisk
user_agent=SIP-AI-Platform-Asterisk

; ============================================================================
; TRANSPORT
; ============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ============================================================================
; LINPHONE CLIENT — 1001
; ============================================================================

[1001]
type=endpoint
context=internal

; Authentication
auth=1001-auth

; Registration AOR
aors=1001

; Outbound identity shown to the callee. Leave `from_user` unset: PJSIP's
; from_user overrides the caller ID, which makes the callee's phone display
; "Anonymous" (or no name). With it unset, the endpoint callerid below is used,
; and a per-call ARI `callerId` can still override it.
; Keep from_domain aligned with the SIP realm; override for your deployment.
callerid=AI Assistant <2000>
from_domain=asterisk

; Codecs
disallow=all
allow=ulaw
allow=alaw

; NAT / Android / PRoot-friendly media settings
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

; DTMF
dtmf_mode=rfc4733

; Identify endpoint by username in From/To headers
identify_by=username

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=1001_secure_password_here

[1001]
type=aor
max_contacts=1
remove_existing=yes

; ============================================================================
; AI SERVICE PLACEHOLDER — 2000
; ============================================================================

[2000]
type=endpoint
context=internal
auth=2000-auth
aors=2000-aor

disallow=all
allow=ulaw
allow=alaw

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[2000-auth]
type=auth
auth_type=userpass
username=2000
password=2000_secure_password_here

[2000-aor]
type=aor
max_contacts=1
remove_existing=yes

; ============================================================================
; SYSTEM ENDPOINT
; ============================================================================

[system]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
